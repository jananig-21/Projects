[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "process-mining-fault-diagnosis"
version = "1.0.0"
description = "Process Mining Driven Modelling & Simulation for Fault Diagnosis in Cyber-Physical Systems"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

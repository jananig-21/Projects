version: "3.9"
services:
  api:
    build: .
    ports: ["8000:8000"]
    env_file: .env
    volumes: ["./models_artifacts:/app/models_artifacts"]
    depends_on: [mlflow, postgres, redis]
    restart: unless-stopped
  train:
    build: .
    command: python -m src.training.train
    env_file: .env
    volumes: ["./models_artifacts:/app/models_artifacts"]
    depends_on: [mlflow, postgres]
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.13.0
    ports: ["5000:5000"]
    command: mlflow server --host 0.0.0.0 --port 5000
    volumes: ["mlflow_data:/mlflow"]
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: quantum
      POSTGRES_PASSWORD: quantumpass
      POSTGRES_DB: quantum_fir
    volumes: ["postgres_data:/var/lib/postgresql/data"]
  redis:
    image: redis:7-alpine
    volumes: ["redis_data:/data"]
volumes:
  mlflow_data:
  postgres_data:
  redis_data:

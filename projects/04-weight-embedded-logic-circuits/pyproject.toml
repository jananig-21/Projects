[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "welc-neural-acceleration"
version = "1.0.0"
description = "Weight Embedded Logic Circuits for Efficient Neural Network Acceleration"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

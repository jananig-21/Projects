version: "3.9"
services:
  api:
    build: .
    ports: ["8003:8003"]
    env_file: .env
    volumes:
      - ./models_artifacts:/app/models_artifacts
      - ./data:/app/data
    depends_on: [mlflow]
    restart: unless-stopped

  train:
    build: .
    command: python -m src.training.train
    env_file: .env
    volumes:
      - ./models_artifacts:/app/models_artifacts
      - ./data:/app/data
    depends_on: [mlflow]

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.13.0
    ports: ["5003:5000"]
    command: mlflow server --host 0.0.0.0 --port 5000
    volumes: ["mlflow_data:/mlflow"]

volumes:
  mlflow_data:

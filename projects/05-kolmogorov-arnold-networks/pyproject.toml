[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "kolmogorov-arnold-networks"
version = "1.0.0"
description = "KANs: Towards Interpretable and Efficient Function Approximation Beyond MLPs"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

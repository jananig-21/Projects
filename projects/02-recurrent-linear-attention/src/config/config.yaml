defaults:
  - _self_
project:
  name: recurrent_linear_attention
  seed: 42
  output_dir: ./models_artifacts
model:
  hidden_dim: 512
  num_layers: 6
  num_heads: 8
  ffn_multiplier: 4
  dropout: 0.1
  max_seq_len: 2048
  vocab_size: 50257
training:
  batch_size: 16
  max_epochs: 50
  learning_rate: 3e-4
  weight_decay: 0.1
  gradient_clip_val: 1.0
  early_stopping_patience: 10
  warmup_ratio: 0.05
  precision: 16-mixed
  accumulate_grad_batches: 4
data:
  seq_len: 2048
  val_split: 0.05
  num_workers: 4
mlflow:
  experiment_name: recurrent_linear_attention
  run_name: rla_baseline
api:
  host: 0.0.0.0
  port: 8001

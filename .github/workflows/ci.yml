name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  static-checks:
    name: Static checks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install tooling
        run: python -m pip install --upgrade pip ruff pyyaml

      - name: Byte-compile every module
        run: python -m compileall -q projects

      - name: Lint for real errors (syntax, undefined names, bad comparisons)
        run: ruff check --select E9,F63,F7,F82 projects

      - name: Guard against .gitignore silently shrinking lint coverage
        run: |
          # ruff honours .gitignore, so an over-broad ignore rule can hide files
          # from the linter without failing anything. Compare what ruff sees
          # against what git actually tracks.
          linted=$(ruff check projects --select E9 --show-files | grep -c '\.py$')
          tracked=$(git ls-files 'projects/**/*.py' | wc -l)
          echo "ruff sees $linted files; git tracks $tracked"
          if [ "$linted" -ne "$tracked" ]; then
            echo "::error::ruff linted $linted files but git tracks $tracked - check .gitignore"
            exit 1
          fi

      - name: Validate Hydra configs and compose files
        run: |
          python - <<'PY'
          import glob, sys, yaml
          failures = []
          targets = glob.glob("projects/*/src/config/config.yaml")
          targets += glob.glob("projects/*/docker-compose.yml")
          for path in targets:
              try:
                  yaml.safe_load(open(path))
              except Exception as exc:
                  failures.append(f"{path}: {exc}")
          for line in failures:
              print(line, file=sys.stderr)
          print(f"checked {len(targets)} files, {len(failures)} invalid")
          sys.exit(1 if failures else 0)
          PY

      - name: Check every project declares its dependencies
        run: |
          missing=0
          for project in projects/*/; do
            for required in pyproject.toml Dockerfile README.md; do
              if [ ! -f "$project$required" ]; then
                echo "::warning file=$project::missing $required"
                missing=$((missing + 1))
              fi
            done
          done
          echo "$missing missing files"
